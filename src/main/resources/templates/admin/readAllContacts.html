<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Read All Contacts</title>
</head>
<body>
<h1>READ ALL CONTACTS SECTION</h1>
<a href="dashboard">ADMIN HOME</a><br><br>

<table border="1">
<thead>
<tr>
<th>ID</th>
<th>NAME</th>
<th>EMAIL</th>
<th>MESSAGE</th>
<th>PHONE</th>
<th>ACTION</th>
</tr>
</thead>
<tbody>
<tr th:each="contact : ${allcontacts}">
    <td style="padding:10px;" th:text="${contact.id}"></td>
    <td th:text="${contact.name}"></td>
    <td th:text="${contact.email}"></td>
    <td th:text="${contact.message}"></td>
    <td th:text="${contact.phone}"></td>
    <td>
        <a th:href="@{/admin/deleteContact(id=${contact.id})}">DELETE</a>
    </td>
</tr>
</tbody>
</table>

</body>
</html>
