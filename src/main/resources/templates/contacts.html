<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contacts</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="main">

    <div th:insert="~{fragments/header.html}"></div>

    <div class="content">
        <div class="container_12">
            
            <!-- Contact Form (left side) -->
            <div class="grid_6 prefix_1">
                <h3>Contact Form</h3>
                <h3 th:text="${message}"></h3>
                <form id="form" th:action="@{/contactform}" th:object="${contactForm}" method="post">

                    <label class="name">
                        <input type="text" th:field="*{name}" placeholder="Name:" th:value="${contactForm.name}" data-constraints="@Required @JustLetters"/>
                        <span style ="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </label>

                    <label class="email">
                        <input type="text" th:field="*{email}" placeholder="E-mail:" th:value="${contactForm.email}" data-constraints="@Required @Email"/>
                        <span style ="color: red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </label>

                    <label class="phone">
                        <input type="number" th:field="*{phone}" placeholder="Phone:" th:value="${contactForm.phone}" data-constraints="@Required @JustNumbers"/>
                        <span style ="color: red" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </label>

                    <label class="message">
                        <textarea th:field="*{message}" placeholder="Message:" th:text="${contactForm.message}"></textarea>
                        <span style ="color: red" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></span>
                    </label>

                    <div class="btns">
                        <button type="submit" class="btn">Send</button>
                        <button type="reset" class="btn">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Map (right side) -->
            <div class="grid_5">
    <h3>Our Location</h3>
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14659.123456789!2d75.8577!3d22.7196!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3962fd1c123456%3A0xabcdef123456789!2sIndore%2C%20Madhya%20Pradesh!5e0!3m2!1sen!2sin!4v1691234567890!5m2!1sen!2sin"
        width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</div>


            <div class="clear"></div>
        </div>
    </div>

    <div th:insert="~{fragments/footer.html}"></div>

</div>
</body>
</html>
